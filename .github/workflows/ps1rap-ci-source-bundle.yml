name: source bundle
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to export
        required: true
        default: v3.4.2
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
      - run: git archive --format=tar.gz --output=lwcgl-${{ github.sha }}.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: lwcgl-source-${{ github.sha }}
          path: lwcgl-${{ github.sha }}.tar.gz
          if-no-files-found: error
