name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Build C library
        run: make
      - name: Compile direct C++ compatibility example
        run: make example
      - name: Verify LWJGL 2.9.3 contracts
        run: make check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install pkg-config glfw
      - name: Build C library
        run: make
      - name: Compile direct C++ compatibility example
        run: make example
      - name: Verify LWJGL 2.9.3 contracts
        run: make check
