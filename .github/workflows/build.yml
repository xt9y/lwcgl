name: verify-v2-once
on:
  push:
    branches: [v2.9.3]
    paths: [.github/verify-now-v2]
concurrency:
  group: lwcgl-v2-verify-once
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
      - name: GCC
        run: xvfb-run -a make clean check
      - name: Clang
        run: xvfb-run -a make clean CC=clang CXX=clang++ check
      - name: ASan UBSan
        run: xvfb-run -a make CC=clang CXX=clang++ sanitize
