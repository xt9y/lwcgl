name: verify-once
on:
  push:
    branches: [v3.4.2]
    paths: [.github/verify-now]
concurrency:
  group: lwcgl-v3-verify-once
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang pkg-config libglfw3-dev xvfb libgl1-mesa-dri
      - name: GCC
        run: xvfb-run -a make clean check
      - name: Clang
        run: xvfb-run -a make clean CC=clang CXX=clang++ check
      - name: ASan UBSan
        run: xvfb-run -a make CC=clang CXX=clang++ sanitize
